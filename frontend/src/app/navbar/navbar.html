<nav>
    <a routerLink="" class="titulo">
        <img src="/Logo_ONG.png" alt="Logo" style="height:110px">
        ONG CONNECT
    </a>
    <ul>
        <li><a routerLink="" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}">Inicio</a></li>
        <li><a routerLink="/voluntariado" routerLinkActive="activo">Voluntariado</a></li>
        <li><a routerLink="/directrices" routerLinkActive="activo">Directrices</a></li>
        <li><a routerLink="/noticias" routerLinkActive="activo">Noticias</a></li>
    </ul>

    <div class="navbar-right">
        <div class="contenedorDonacion">
            <a href="https://www.paypal.com/donate/?hosted_button_id=VQ6ERZUCREMML" target="_blank" class="btn-donar">Dona ahora</a>
        </div>
    
        <div class="perfil-wrapper">
            <button class="perfil-btn" (click)="toggleDropdown($event)" id="profile-toggle">
                <ng-container *ngIf="user; else iconoDefault">
                    <span class="perfil-avatar">{{ getUserInitial() }}</span>
                </ng-container>
                <ng-template #iconoDefault>
                    <svg class="perfil-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </ng-template>
            </button>
    
            <div class="perfil-dropdown" *ngIf="dropdownOpen" id="profile-dropdown">
                <!-- Si NO está logueado -->
                <ng-container *ngIf="!user">
                    <div class="dropdown-simple">
                        <a routerLink="/login" (click)="dropdownOpen = false" class="btn-dropdown-simple">Iniciar sesión</a>
                        <a routerLink="/formulario" (click)="dropdownOpen = false" class="btn-dropdown-simple outline">Registrarse</a>
                    </div>
                </ng-container>
    
                <!-- Si ESTÁ logueado -->
                <ng-container *ngIf="user">
                    <div class="user-info-panel">
                        <div class="user-avatar-large">{{ getUserInitial() }}</div>
                        <h3>{{ user.name }}</h3>
                        <p class="user-email">{{ user.email }}</p>
                        <span class="user-badge" [ngClass]="user.rol === 'admin' ? 'badge-admin' : 'badge-volunteer'">
                            {{ user.rol === 'admin' ? 'Administrador' : 'Voluntario' }}
                        </span>
                    </div>
                    <div class="dropdown-divider"></div>
                    <button class="btn-logout" (click)="onLogout()" id="logout-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                        Cerrar sesión
                    </button>
                </ng-container>
            </div>
        </div>
    </div>

</nav>
