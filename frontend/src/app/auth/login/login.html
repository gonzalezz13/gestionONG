<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h2>Bienvenido de nuevo</h2>
      <p>Acceso seguro a tu panel de la ONG.</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">

      <!-- Email -->
      <div class="form-group">
        <label for="email">Dirección de correo</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input type="email" id="email" [(ngModel)]="loginEmail" name="email" placeholder="nombre@organizacion.org">
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <div class="label-row">
          <label for="password">Contraseña</label>
          <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
        <div style="position: relative; width: 100%;">
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="loginPassword" name="password" placeholder="••••••••">
          </div>
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword" *ngIf="loginPassword && loginPassword.length > 0">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <p class="error-message" *ngIf="loginError">{{ loginError }}</p>

      <!-- Submit -->
      <button type="submit" class="btn-submit" [disabled]="loginLoading">
        {{ loginLoading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        <svg *ngIf="!loginLoading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>

    <div class="login-footer">
      <p>¿No tienes una cuenta? <a routerLink="/formulario">Regístrate como voluntario</a></p>
    </div>
  </div>

  <div class="page-footer">
    <p>© 2026 ONG Connect Platform. Secure SSL Encrypted.</p>
  </div>
</div>
