<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h2>Recuperar contraseña</h2>
      <p>Introduce tu correo para recibir un enlace de recuperación.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="email">Dirección de correo</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="email" 
            required 
            email
            placeholder="nombre@organizacion.org">
        </div>
      </div>

      <p class="status-message" *ngIf="message" [class.error]="isError">{{ message }}</p>

      <button type="submit" class="btn-submit" [disabled]="!forgotForm.form.valid || isLoading">
        {{ isLoading ? 'Enviando...' : 'Enviar enlace de recuperación' }}
        <svg *ngIf="!isLoading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>

    <div class="login-footer">
      <p><a routerLink="/login">Volver al inicio de sesión</a></p>
    </div>
  </div>

  <div class="page-footer">
    <p>© 2026 ONG Connect Platform. Secure SSL Encrypted.</p>
  </div>
</div>
