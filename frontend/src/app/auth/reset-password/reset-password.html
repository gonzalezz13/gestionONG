<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h2>Nueva contraseña</h2>
      <p *ngIf="!success">Introduce tu nueva contraseña a continuación.</p>
    </div>

    <div *ngIf="success" class="success-content">
      <div class="success-icon">✓</div>
      <p class="status-message">{{ message }}</p>
      <button routerLink="/login" class="btn-submit">Ir al inicio de sesión</button>
    </div>

    <form *ngIf="!success" (ngSubmit)="onSubmit()" #resetForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="password">Nueva contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="newPassword" 
            required 
            minlength="6"
            placeholder="••••••••">
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            required 
            placeholder="••••••••">
        </div>
      </div>

      <p class="status-message error" *ngIf="message && isError">{{ message }}</p>

      <button type="submit" class="btn-submit" [disabled]="!resetForm.form.valid || isLoading || !token">
        {{ isLoading ? 'Actualizando...' : 'Cambiar contraseña' }}
        <svg *ngIf="!isLoading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
  </div>

  <div class="page-footer">
    <p>© 2026 ONG Connect Platform. Secure SSL Encrypted.</p>
  </div>
</div>
